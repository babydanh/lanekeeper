[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "lanekeeper"
version = "0.1.0"
description = "Run many AI coding agents in parallel git worktrees without clobbering each other: conflict warnings before edits, a local merge queue, and a guard against commands that lose code."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "babydanh" }]
keywords = ["git", "worktree", "ai-agents", "claude-code", "codex", "gemini-cli", "cursor", "merge-queue"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/babydanh/lanekeeper"
Issues = "https://github.com/babydanh/lanekeeper/issues"

[project.scripts]
lanekeeper = "lanekeeper.cli:main"
lk = "lanekeeper.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lanekeeper"]
